name: Release

# Publica a release quando uma tag de versão é criada (por exemplo: git tag v0.0.5 && git push origin v0.0.5).
# A versão da tag precisa ser igual à do manifest. O zip é reprodutível: o SHA-256 vai nas notas e no arquivo SHA256SUMS.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Gerar e publicar a release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Conferir a versão da tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./manifest.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest package=$pkg"
          # O package.json segue semver de 3 partes (1.0.0); o manifest pode ter uma 4ª parte numérica (1.0.0.1).
          # A tag é a versão do manifest (a que identifica o zip) ou a do package.json.
          case "$manifest" in
            "$pkg"|"$pkg".[0-9]*) ;;
            *) echo "O manifest ($manifest) precisa começar com a versão do package.json ($pkg)." >&2; exit 1 ;;
          esac
          if [ "$tag" != "$pkg" ] && [ "$tag" != "$manifest" ]; then
            echo "A tag (v$tag) precisa ser igual à versão do manifest ($manifest) ou do package.json ($pkg)." >&2
            exit 1
          fi

      - name: Conferir que a tag está na main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "A tag precisa apontar para um commit que já está na main." >&2
            exit 1
          fi

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Verificação completa
        run: npm run check

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Empacotar extensão
        run: node scripts/package.mjs

      - name: Conferir que os zips são reprodutíveis
        run: |
          first="$(sha256sum release/*.zip)"
          node scripts/package.mjs
          second="$(sha256sum release/*.zip)"
          [ "$first" = "$second" ] || { echo "Os zips não são reprodutíveis." >&2; exit 1; }

      - name: Conferir o pacote instalável (com chave) e o da loja (sem chave)
        run: |
          mkdir -p "$RUNNER_TEMP/instalavel" "$RUNNER_TEMP/loja"
          unzip -q release/escrita-digimais.ai_v*[0-9].zip -d "$RUNNER_TEMP/instalavel"
          unzip -q release/escrita-digimais.ai_v*_loja.zip -d "$RUNNER_TEMP/loja"
          node scripts/verify-dist.mjs "$RUNNER_TEMP/instalavel" --com-chave
          node scripts/verify-dist.mjs "$RUNNER_TEMP/loja"

      - name: Calcular SHA-256
        run: |
          cd release
          sha256sum *.zip | tee SHA256SUMS.txt

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install_zip="$(ls release/escrita-digimais.ai_v*[0-9].zip)"
          store_zip="$(ls release/escrita-digimais.ai_v*_loja.zip)"
          install_sha="$(grep -F "$(basename "$install_zip")" release/SHA256SUMS.txt | cut -d' ' -f1)"
          store_sha="$(grep -F "$(basename "$store_zip")" release/SHA256SUMS.txt | cut -d' ' -f1)"
          id="$(node -p "require('./scripts/extension-key.json').extensionId")"
          cat > notes.md <<NOTES
          Pacotes do Assistente de Textos do Service Desk, versão ${GITHUB_REF_NAME#v}, gerados do commit \`${GITHUB_SHA::7}\` da main.

          - **Instalável** (\`$(basename "$install_zip")\`): leva o ID fixo \`${id}\`. Instalar uma versão nova substitui a anterior e mantém as preferências, em qualquer pasta. SHA-256: \`${install_sha}\`
          - **Loja** (\`$(basename "$store_zip")\`): sem chave, para envio à loja de extensões, que define o próprio ID. SHA-256: \`${store_sha}\`

          Verifique o hash antes de instalar: \`sha256sum -c SHA256SUMS.txt\`. Os zips são reprodutíveis: gerar o mesmo commit de novo produz os mesmos hashes.

          Instalação para teste: extraia o zip instalável em uma pasta fixa, abra \`edge://extensions\`, ative o modo do desenvolvedor e use "Carregar sem compactação". Para atualizar, veja \`docs/DESENVOLVIMENTO-EDGE.md\`. Requer Edge 116 ou superior.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$install_zip" "$store_zip" release/SHA256SUMS.txt \
            --title "Versão ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
