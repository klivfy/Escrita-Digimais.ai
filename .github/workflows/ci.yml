name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, testes, build e verificação do pacote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Verificação completa
        run: npm run check

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Empacotar extensão
        run: node scripts/package.mjs

      - name: Publicar pacote como artefato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extensao-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Conferir que os zips são reprodutíveis
        run: |
          first="$(sha256sum release/*.zip)"
          node scripts/package.mjs
          second="$(sha256sum release/*.zip)"
          [ "$first" = "$second" ] || { echo "Os zips não são reprodutíveis." >&2; exit 1; }

      - name: Conferir o pacote instalável (com chave) e o da loja (sem chave)
        run: |
          mkdir -p "$RUNNER_TEMP/instalavel" "$RUNNER_TEMP/loja"
          unzip -q release/escrita-digimais.ai_v*[0-9].zip -d "$RUNNER_TEMP/instalavel"
          unzip -q release/escrita-digimais.ai_v*_loja.zip -d "$RUNNER_TEMP/loja"
          node scripts/verify-dist.mjs "$RUNNER_TEMP/instalavel" --com-chave
          node scripts/verify-dist.mjs "$RUNNER_TEMP/loja"

  e2e:
    name: Extensão empacotada em Chromium real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Build e empacotamento
        run: |
          npm run build
          node scripts/package.mjs

      - name: Extrair o pacote que seria publicado
        run: |
          mkdir -p "$RUNNER_TEMP/ext"
          unzip -q release/escrita-digimais.ai_v*[0-9].zip -d "$RUNNER_TEMP/ext"
          node scripts/verify-dist.mjs "$RUNNER_TEMP/ext" --com-chave

      - name: Playwright (fora do lockfile, só para este job)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Demonstração em Chromium com a extensão carregada
        run: node scripts/demo-capture.mjs "$RUNNER_TEMP/ext" "$RUNNER_TEMP/demo"

      - name: Ensaio do piloto (contadores e privacidade)
        run: node scripts/pilot-rehearsal.mjs "$RUNNER_TEMP/ext" "$RUNNER_TEMP/ensaio"

      - name: Publicar imagens da demonstração
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demonstracao-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/demo
          if-no-files-found: ignore
          retention-days: 7
